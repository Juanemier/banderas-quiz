<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Juego de Banderas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Juego de Banderas</h1>
      <div id="top3"></div>
    </header>

    <main>
      <div id="info">Pulsa JUGAR para comenzar</div>

      <div id="flag-area">
        <img id="flag-img" src="" alt="Bandera" />
      </div>

      <div id="options">
        <button class="opt" id="opt0"></button>
        <button class="opt" id="opt1"></button>
        <button class="opt" id="opt2"></button>
      </div>

      <div id="controls">
        <button id="start">JUGAR</button>
        <button id="reset-ranking">Borrar ranking</button>
      </div>

      <div id="result"></div>
    </main>

    <footer>
      <p>Hécho con ❤️ — Publica en GitHub Pages (ve README)</p>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
